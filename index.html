<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Inquiry Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-white mb-1">Partner With Us</h1>
    <p class="text-sm text-slate-400 mb-6">Submit your business details and our AI agent will prepare a tailored profile.</p>

    <form id="leadForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
        <input type="text" id="fullName" required placeholder="Enter your full name"
          class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Business Name</label>
        <input type="text" id="businessName" required placeholder="Enter your business name"
          class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Business Size</label>
        <select id="businessSize" required
          class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
          <option value="">Select team size...</option>
          <option value="1-10 employees">1–10 employees (Startup)</option>
          <option value="11-50 employees">11–50 employees (Small Business)</option>
          <option value="51-200 employees">51–200 employees (Mid-Market)</option>
          <option value="200+ employees">200+ employees (Enterprise)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Business Website</label>
        <input type="text" id="website" required placeholder="https://example.com"
          class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" />
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-white transition cursor-pointer">
        Submit Details
      </button>
    </form>

    <div id="statusMsg" class="hidden mt-4 p-3 rounded-lg text-sm"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://smme.app.n8n.cloud/webhook/ce82669f-331c-4088-958c-6cc2085130f1";

    document.getElementById("leadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMsg");

      let rawUrl = document.getElementById("website").value.trim();
      if (!rawUrl.startsWith("http://") && !rawUrl.startsWith("https://")) {
        rawUrl = "https://" + rawUrl;
      }

      const payload = {
        fullName: document.getElementById("fullName").value.trim(),
        businessName: document.getElementById("businessName").value.trim(),
        businessSize: document.getElementById("businessSize").value,
        website: rawUrl,
        submittedAt: new Date().toISOString()
      };

      btn.disabled = true;
      btn.textContent = "Submitting...";
      statusMsg.classList.add("hidden");

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Webhook returned status " + res.status);

        statusMsg.textContent = "Success! Your business details have been submitted for AI research.";
        statusMsg.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-950 border border-emerald-800 text-emerald-300";
        document.getElementById("leadForm").reset();
      } catch (err) {
        statusMsg.textContent = "Error: Could not reach n8n webhook. Check console/URL.";
        statusMsg.className = "mt-4 p-3 rounded-lg text-sm bg-red-950 border border-red-800 text-red-300";
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Details";
      }
    });
    window.addEventListener("DOMContentLoaded", () => {
  document.querySelector("form").reset();
});
  </script>
</body>
</html>
